name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-android
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  emulator:
    name: Android emulator
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-android
      - uses: ./.github/actions/emulator-kvm
      - name: Run device integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/workflows/test-android.sh
      - name: Save device failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: android-diagnostics/
          if-no-files-found: ignore
