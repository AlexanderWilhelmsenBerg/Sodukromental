name: sodukromental
description: A pocket Sudoku library and a colony of number-gathering creatures.
publish_to: none
version: 0.2.0+3
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.4'
dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flame: ^1.38.2
  html: ^0.15.7
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/library/
    - assets/fonts/PlusJakartaSans-LICENSE.txt
    - assets/fonts/JetBrainsMono-LICENSE.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
